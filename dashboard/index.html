<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Dashboard</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><div><p class="eyebrow">ENGINEERING WORKSPACE</p><h1 id="project-name">Project Dashboard</h1></div><a id="github-projects" hidden target="_blank" rel="noreferrer">GitHub Projects ↗</a></header>
<main><section class="toolbar"><input id="search" type="search" placeholder="Search tasks or features…" aria-label="Search tasks"><select id="sprint-filter"><option value="">All sprints</option></select><select id="assignee-filter"><option value="">All agents</option></select></section><section id="metrics" class="metrics"></section>
<nav class="tabs" aria-label="Dashboard views"><button class="active" data-view="kanban">Kanban</button><button data-view="features">Features</button><button data-view="sprints">Sprints</button><button data-view="roadmap">Roadmap</button><button data-view="agents">Agents</button></nav><section id="view" aria-live="polite"></section><p class="footnote">Read-only dashboard · Markdown task files are the source of truth</p></main><script type="module" src="./app.js"></script></body></html>
